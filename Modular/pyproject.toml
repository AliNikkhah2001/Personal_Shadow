[project]
name = "mind-palace-os"
version = "2.0.0-beta"
description = "Sherlock Holmes Mind Palace - Productivity, analytics, and knowledge management system"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "shadow_os_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B904",  # raise from in exceptions (not always applicable)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"system_bridge.py" = ["E402", "N802", "RUF012"]
"handlers/*.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
